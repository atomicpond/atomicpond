# Draws today's pond and publishes it to the `output` branch, which the
# README's image points at. That branch is replaced each run (no history), so
# the daily images don't pile up in the repository.
name: Pond

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pond.py, .github/workflows/pond.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: pond

jobs:
  pond:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: python3 pond.py dist

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: Today's pond
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub turns off scheduled workflows in public repos after 60 days
      # without activity. Re-enabling it each run resets that clock.
      - name: Keep the schedule on
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pond.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
